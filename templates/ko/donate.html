<!DOCTYPE html>
<html lang="ko">

<head>
    <!-- @include partials/head.html font="PretendardVariable.woff2" title="후원 · YuruMirror" description="학생 혼자 돌리는 미러야. GitHub Sponsors로 후원할 수 있어." -->
    <!-- @include partials/hreflang.html path="/donate.html" -->
</head>

<body>
    <!-- @include partials/ko/nav.html langhref="/donate.html?lang=en" -->

    <main class="relative mx-auto w-full max-w-2xl grow px-4 py-16 sm:px-6 lg:py-20">
        <div class="glow -top-20 right-0 size-80 bg-plum-400/15" aria-hidden="true"></div>

        <header class="relative text-center">
            <span class="mx-auto flex size-12 items-center justify-center rounded-2xl bg-accent-soft text-accent-strong">
                <svg class="size-6" aria-hidden="true"><use href="#i-heart"/></svg>
            </span>
            <h1 class="mt-5 text-3xl font-bold tracking-tight text-ink sm:text-4xl">YuruMirror 후원</h1>
            <p class="mx-auto mt-4 max-w-lg text-lg/relaxed">
                미러 굴리는 데 돈이 어마어마하게 나가거든.
                학생 혼자 버티고 있으니까 후원해 주면 진짜 고마워.
            </p>
        </header>

        <section class="card relative mt-10 p-8" aria-labelledby="gh-sponsors">
            <div class="flex items-center gap-4">
                <span class="flex size-12 items-center justify-center rounded-2xl bg-inset text-ink">
                    <svg class="size-6" aria-hidden="true"><use href="#i-github"/></svg>
                </span>
                <div>
                    <h2 id="gh-sponsors" class="text-xl font-bold text-ink">GitHub Sponsors</h2>
                    <p class="text-sm text-faint">지금은 이것만 돼. 토스아이디는 서비스 종료됐거든.</p>
                </div>
            </div>

            <dl class="mt-6 divide-y divide-line border-y border-line text-sm">
                <div class="flex items-center justify-between py-3">
                    <dt class="text-faint">지역</dt>
                    <dd class="font-medium text-ink">어디서든</dd>
                </div>
                <div class="flex items-center justify-between py-3">
                    <dt class="text-faint">결제</dt>
                    <dd class="font-medium text-ink">한 번이든 매달이든</dd>
                </div>
            </dl>

            <a href="https://github.com/sponsors/NoaHimesaka1873" class="btn-primary mt-6 w-full">
                <svg class="size-4" aria-hidden="true"><use href="#i-heart"/></svg>
                GitHub에서 후원
            </a>
        </section>

        <section class="relative mt-10" aria-labelledby="why-donate">
            <h2 id="why-donate" class="text-lg font-semibold text-ink">어디에 쓰이냐면</h2>
            <ul class="mt-4 grid gap-3 sm:grid-cols-2">
                <li class="card flex items-center gap-3 p-4 text-sm">
                    <svg class="size-4 flex-none text-accent" aria-hidden="true"><use href="#i-server"/></svg>
                    <span>매달 서버비만 $30 넘게 나가.</span>
                </li>
                <li class="card flex items-center gap-3 p-4 text-sm">
                    <svg class="size-4 flex-none text-accent" aria-hidden="true"><use href="#i-zap"/></svg>
                    <span>미러 9개를 4 Gbps로 서빙하니까 대역폭도 장난 아니야.</span>
                </li>
                <li class="card flex items-center gap-3 p-4 text-sm">
                    <svg class="size-4 flex-none text-accent" aria-hidden="true"><use href="#i-database"/></svg>
                    <span>배포판 5개치 저장 공간도 공짜는 아니거든.</span>
                </li>
                <li class="card flex items-center gap-3 p-4 text-sm">
                    <svg class="size-4 flex-none text-accent" aria-hidden="true"><use href="#i-heart"/></svg>
                    쿄코가 아무리 졸라도 럼레이즌 아이스크림에는 한 푼도 안 가.
                </li>
            </ul>
        </section>
    </main>

</html>
